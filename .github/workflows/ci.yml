name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm exec -- oxlint .
      - run: npm exec -- eslint .
      - run: npm run test:unit -- --run
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - run: bundle exec ruby bin/rails db:prepare
      - run: bundle exec ruby bin/rails test
